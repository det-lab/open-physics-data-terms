# Index of contributions. The website is generated from this file.
# One entry per contributor. Fields:
#   id          short slug, matches the PDF filename without .pdf
#   name        contributor's name as they want it shown
#   orcid       the contributor's ORCID iD (16 digits with hyphens), if known
#   doi         the contribution's Zenodo CONCEPT DOI (permalink to the latest
#               version); filled in by the release script and used on the website
#   doi_version the DOI of the specific upload, also filled in by the script
#   cite_name   optional, 'Family, Given' for citations when the last word of
#               name is not the family name (e.g. 'de la Cruz, Maria')
#   affiliation institution and the experiment/project they speak from
#   kind        "written" (they wrote the page) or "call" (drafted by the
#               organizers from a 20-minute call, then edited and approved)
#   title       the page's own title, if it has one (optional)
#   descriptor  one sentence, in plain words, on what the page is about
#   licenses    the terms the page reports, as key: value pairs, e.g.
#                 licenses: {data: CC0, code: GPL v3}
#               keys are usually data and code; use others (docs, models) as
#               needed. Record only what the page itself states; use
#               "none stated" when the page says a release carried no license.
#               Omit the field if the page reports none.
#   received    date the page or call happened (YYYY-MM-DD)
#   approved    date the contributor approved the posted text, or null
#   file        path to the PDF, relative to this repo
#   license     always CC-BY-4.0; stated inside the PDF too

- id: usai-alabama
  name: Emanuele Usai
  affiliation: University of Alabama, CMS Collaboration
  orcid: 0000-0001-9323-2107   # from Amy, 2026-10-14; confirm with him
  kind: written
  title: "Don't just ship the container: lessons from 42 TiB of low-level CMS open data"
  descriptor: "CMS releases preserve results but are not yet reusable: what 42 TiB of low-level open data taught its co-producer about formats, byte-level documentation, and why RAW data still matters."
  licenses: {data: CC0, code: GPL v3}
  received: 2026-10-14
  approved: 2026-10-14
  file: contributions/usai-alabama.pdf
  license: CC-BY-4.0
